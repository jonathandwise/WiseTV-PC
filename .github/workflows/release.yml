name: Build and release

# When package.json on main has a version with no release yet, this builds the Windows installer and
# publishes it as release v<version> (which also creates the tag). Installed copies of WiseTV check the
# latest release when they start and offer the update. "Run workflow" does the same on demand.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$V is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        if: steps.ver.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install -y nsis p7zip-full zip

      - name: Install packages
        if: steps.ver.outputs.new == 'true'
        run: npm ci

      - name: Download Electron for Windows and mpv
        if: steps.ver.outputs.new == 'true'
        run: bash scripts/fetch-vendor.sh

      - name: Build installer
        if: steps.ver.outputs.new == 'true'
        run: node package-win.js

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          node scripts/release-notes.js "$V" > notes.md
          gh release create "v$V" "build/WiseTV-Setup-$V.exe" "build/WiseTV-$V-portable.zip" \
            --target "$GITHUB_SHA" --title "WiseTV $V" --notes-file notes.md
